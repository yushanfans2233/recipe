name: Deploy to GitHub Pages

on:
  # 推送到 main 就自动部署到 https://yushanfans2233.github.io/recipe/
  push:
    branches: [main]
  # 也可以在仓库 Actions 页面手动触发
  workflow_dispatch:

# 允许工作流读取仓库并发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 先校验：类型、内容结构、字体子集。不过就不部署。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Font subset check
        run: npm run check:fonts

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
